name: release

# Publishes @ruleatlas/ui to npm when a version tag (v*) is pushed.
# Requires an NPM_TOKEN repository secret with publish rights to the @ruleatlas scope.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build
      - name: Dependency audit
        run: yarn audit --json
      - name: Installed package ESM and React compatibility
        run: yarn check:package
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
